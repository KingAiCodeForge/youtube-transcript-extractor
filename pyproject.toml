[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-youtube-transcript-extractor"
dynamic = ["version"]
description = "Deterministic CLI and GUI tools for exporting YouTube transcripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["youtube-transcript-api>=1.2.3"]

[project.optional-dependencies]
gui = [
  "PySide6>=6.5.0",
  "yt-dlp>=2023.7.6",
  "SpeechRecognition>=3.10.0",
  "pydub>=0.25.1",
  "ffmpeg-python>=0.2.0",
  "requests>=2.31.0",
]
local-media = ["faster-whisper>=1.0.0"]
test = ["flake8>=7", "pytest>=8"]

[project.scripts]
youtube-transcript = "youtube_transcript_cli:main"
local-media-transcribe = "local_media_transcribe:main"

[tool.setuptools]
py-modules = ["youtube_transcript_cli", "local_media_transcribe"]

[tool.setuptools.dynamic]
version = {attr = "youtube_transcript_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
