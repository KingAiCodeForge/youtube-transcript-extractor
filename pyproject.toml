[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kingai-youtube-transcript-extractor"
dynamic = ["version"]
description = "Deterministic command-line tools for exporting transcripts"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["youtube-transcript-api>=1.2.3"]

[project.optional-dependencies]
local-media = ["faster-whisper>=1.2.1"]
test = ["flake8>=7", "pytest>=8"]

[project.scripts]
youtube-transcript = "youtube_transcript_cli:main"
local-media-transcribe = "local_media_transcribe:main"

[tool.setuptools]
py-modules = ["youtube_transcript_cli", "local_media_transcribe"]

[tool.setuptools.dynamic]
version = {attr = "youtube_transcript_cli.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
